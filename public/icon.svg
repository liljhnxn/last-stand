<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="emeraldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <path d="M32 4 L56 14 C56 36 32 58 32 58 C32 58 8 36 8 14 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#emeraldStroke)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Hazard / Skull Emblem -->
  <!-- Forehead -->
  <path d="M24 24 C24 19 40 19 40 24 C40 28 38 31 38 34 L26 34 C26 31 24 28 24 24 Z" 
        fill="#10b981" />
  
  <!-- Left Eye -->
  <circle cx="28" cy="27" r="2.5" fill="#0b0f19" />

  <!-- Right Eye -->
  <circle cx="36" cy="27" r="2.5" fill="#0b0f19" />

  <!-- Nose cavity -->
  <polygon points="32,30 30.5,33 33.5,33" fill="#0b0f19" />

  <!-- Teeth / Jaw -->
  <path d="M28 36 L28 40 L30 40 L30 36 L32 36 L32 40 L34 40 L34 36 L36 36 L36 40 L36 36" 
        stroke="#10b981" 
        stroke-width="1.8" 
        stroke-linecap="round" />

  <!-- Top Beacon indicator -->
  <circle cx="32" cy="11" r="2" fill="#34d399" />
</svg>
